# Releases with release-plz (release-plz.toml). Run it from the Actions tab to open or update
# the release pull request; merging that pull request tags the release, and this workflow then
# starts the release workflow on the tag. docs/releasing.md describes the steps.
#
# Pull requests and tags made with GITHUB_TOKEN start no workflow, except one dispatched:
# so this workflow dispatches CI on the release pull request, and the release on its tag.
name: Release-plz

on:
  # Opens or updates the release pull request.
  workflow_dispatch:
  # Tags the release once its pull request is merged; other commits release nothing.
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  release-pr:
    name: Release pull request
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: release-plz-pr
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - name: Fetch Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history, for the commits and tags since the last release.
          fetch-depth: 0
          persist-credentials: false

      # release-plz runs cargo to update Cargo.lock.
      - name: Install stable toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache: false

      - name: Open or update the release pull request
        id: release-plz
        uses: release-plz/action@66b324fd6c72d05d2a08568492ecdd62bfb8a62b # v0.5.148
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The output is empty when there is nothing to release.
      - name: Run CI on the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.release-plz.outputs.pr }}
        run: |
          branch=$(jq -r '.head_branch // empty' <<< "$PR")
          if [ -z "$branch" ]; then
            echo "Nothing to release."
            exit 0
          fi
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$branch"

  release:
    name: Tag the release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: release-plz-release
      cancel-in-progress: false
    permissions:
      # To push the tag.
      contents: write
      # To find whether the commit comes from a release pull request.
      pull-requests: read
      # To start the release workflow.
      actions: write
    steps:
      - name: Fetch Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install stable toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache: false

      - name: Tag a merged release pull request
        id: release-plz
        uses: release-plz/action@66b324fd6c72d05d2a08568492ecdd62bfb8a62b # v0.5.148
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The list is empty when the commit is not from a release pull request.
      - name: Start the release workflow
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASES: ${{ steps.release-plz.outputs.releases }}
        run: |
          for tag in $(jq -r '.[]?.tag' <<< "$RELEASES"); do
            gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "$tag"
            echo "Started the release workflow on ${tag}."
          done
