name: Advisory audit

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  advisories:
    name: cargo-deny advisories
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Fetch Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check advisories
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories
          rust-version: "stable"

      - name: Report failed audit
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="cargo-deny advisory audit failed"
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          issue_number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --limit 1000 --json number,title \
            --jq 'first(.[] | select(.title == "cargo-deny advisory audit failed")) | .number')
          if [ -n "$issue_number" ]; then
            gh issue comment "$issue_number" --repo "$GITHUB_REPOSITORY" \
              --body "Another audit failed: $run_url"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" \
              --body "Review the failed audit run: $run_url"
          fi
