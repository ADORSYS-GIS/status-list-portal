name: CI

on:
  pull_request:
  push:
    branches:
      - main
  merge_group:
  workflow_dispatch:
  # Runs the live-admin-api job against the server's develop branch as well, so a change to
  # its admin API shows up before anyone moves the pin below.
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  rustfmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install stable toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          components: rustfmt
          cache: false

      - name: Check formatting
        run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Fetch Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install stable toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          components: clippy
          cache-shared-key: workspace

      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/portal_test
    steps:
      - name: Fetch Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install stable toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache-shared-key: workspace

      - name: Run tests
        run: cargo test --all-targets --locked

      - name: Run doc tests
        run: cargo test --doc --locked

  live-admin-api:
    name: Tests against the Status List Server
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: status_list
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # No release has the admin API yet: a commit of develop, which holds what the next
      # release ships. Pin that release's tag once it is out. The nightly run takes develop's
      # head instead, to catch changes the pin does not have yet.
      STATUS_LIST_SERVER_REF: ${{ github.event_name == 'schedule' && 'develop' || '6f53ece6e7eb5eb60b6a2776d93d8ff38f70092e' }}
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/portal_test
      LIVE_ADMIN_API_URL: http://127.0.0.1:8002
    steps:
      - name: Fetch Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch the Status List Server
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: adorsys/status-list-server
          ref: ${{ env.STATUS_LIST_SERVER_REF }}
          path: status-list-server
          persist-credentials: false

      - name: Install stable toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache-shared-key: live-admin-api
          cache-workspaces: |
            . -> target
            status-list-server -> target

      - name: Install the server's build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake golang-go

      - name: Build the Status List Server
        working-directory: status-list-server
        run: cargo build --locked --features postgres

      - name: Start the Status List Server
        run: |
          scripts/live-status-list-server.sh status-list-server \
            postgres://postgres:postgres@localhost:5432/status_list > status-list-server.log 2>&1 &
          for _ in $(seq 60); do
            if curl -fs -o /dev/null http://127.0.0.1:8002/health/ready; then exit 0; fi
            sleep 1
          done
          cat status-list-server.log
          exit 1

      - name: Run the tests against it
        # The tests are ignored by default, and fail without LIVE_ADMIN_API_URL when asked for.
        run: cargo test --test integration --locked live_admin_api -- --ignored

      - name: Show the server's log
        if: failure()
        run: cat status-list-server.log

  cargo-deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check dependencies
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          rust-version: "stable"

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Chromium for the component tests
        run: bun run playwright install --with-deps chromium

      - name: Lint
        run: bun run lint

      - name: Check types
        run: bun run check

      - name: Run tests
        run: bun run test

      # Developers run the key scripts with Node.js, so they are checked on it too.
      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      - name: Run the key scripts on Node.js
        run: bun run --cwd frontend vitest --run src/lib/keys.test.ts

      - name: Build
        run: bun run build

      # The backend reads the policy from this tag; keep it in the form the backend expects.
      - name: Check the page's content security policy
        run: grep -q '<meta http-equiv="content-security-policy" content="' frontend/build/200.html

  markdown:
    name: Markdown
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          globs: "**/*.md"

  toml:
    name: TOML
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install tombi
        uses: tombi-toml/setup-tombi@e0db57b0c2dfee98ec48ee3f02beb983fba2aa09 # v1.9.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint TOML
        run: tombi lint

      - name: Check TOML formatting
        run: tombi format --check

  yaml:
    name: YAML
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false

      - name: Install yamlfmt
        run: go install github.com/google/yamlfmt/cmd/yamlfmt@v0.21.0

      - name: Check YAML formatting
        run: yamlfmt -lint .

  typos:
    name: Typos
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check spelling
        uses: crate-ci/typos@7f9d0819ca1c008ade73f4b41fa9d258d48f605b # v1.51.1
