name: CI

on:
  pull_request:
  push:
    branches:
      - main
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  rustfmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install stable toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          components: rustfmt
          cache: false

      - name: Check formatting
        run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Fetch Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install stable toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          components: clippy
          cache-shared-key: workspace

      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/portal_test
    steps:
      - name: Fetch Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install stable toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache-shared-key: workspace

      - name: Start TLS Postgres
        run: bash test_data/start_tls_postgres.sh >> "$GITHUB_ENV"

      - name: Run tests
        run: cargo test --all-targets --locked

      - name: Run doc tests
        run: cargo test --doc --locked

      - name: Stop TLS Postgres
        if: always() && env.TEST_TLS_CONTAINER != ''
        run: docker rm -f "$TEST_TLS_CONTAINER"

  schema:
    name: Diesel schema
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - name: Fetch Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install stable toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache: false

      - name: Install Diesel CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev
          cargo install diesel_cli --version 2.3.5 --no-default-features --features postgres --locked

      - name: Check schema against migrations
        run: |
          diesel migration run
          diesel print-schema > src/schema.rs
          git diff --exit-code -- src/schema.rs

  cargo-deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check dependencies
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          rust-version: "stable"

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Chromium for the component tests
        run: bun run playwright install --with-deps chromium

      - name: Lint
        run: bun run lint

      - name: Check types
        run: bun run check

      - name: Run tests
        run: bun run test

      # Developers run the key scripts with Node.js, so they are checked on it too.
      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      - name: Run the key scripts on Node.js
        run: bun run --cwd frontend vitest --run src/lib/keys.test.ts

      - name: Build
        run: bun run build

      # The backend reads the policy from this tag; keep it in the form the backend expects.
      - name: Check the page's content security policy
        run: grep -q '<meta http-equiv="content-security-policy" content="' frontend/build/200.html

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      E2E_DATABASE_URL: postgres://postgres:postgres@localhost:5432/portal_e2e
    steps:
      - name: Fetch Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install stable toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache-shared-key: workspace

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Chromium
        run: bun run playwright install --with-deps chromium

      - name: Run the end-to-end tests
        run: bun run test:e2e

      - name: Keep the report and traces of a failed run
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

  image:
    name: Container image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - name: Fetch Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the image
        run: docker build --tag status-list-portal .

      - name: Check that it runs without privileges
        run: test "$(docker image inspect --format '{{.Config.User}}' status-list-portal)" = 65532

      # The image's own server, not the end-to-end job's debug build: its static binary, CA
      # certificates and frontend path. In production, plaintext reaches only a local database.
      - name: Check that it serves the portal
        run: |
          cat > "$RUNNER_TEMP/portal.env" <<EOF
          APP_SERVER__ORIGIN=http://localhost:8080
          APP_DATABASE__URL=postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
          APP_SESSION__KEY=$(openssl rand -hex 64)
          APP_GITHUB__CLIENT_ID=ci
          APP_GITHUB__CLIENT_SECRET=ci
          APP_ADMIN_API__URL=http://localhost:8002
          APP_ADMIN_API__PRINCIPAL=portal
          APP_ADMIN_API__AUDIENCE=status-list-server
          APP_ADMIN_API__KEY_ID=ci
          APP_ADMIN_API__SIGNING_KEY_FILE=/run/secrets/admin-key.pem
          APP_MANAGEMENT_API__URL=https://status.example.com
          APP_MANAGEMENT_API__AUDIENCE=https://status.example.com
          APP_TERMS__VERSION=ci
          APP_TERMS__URL=https://example.com/terms
          EOF
          docker run --rm --network host --env-file "$RUNNER_TEMP/portal.env" status-list-portal migrate
          docker run --detach --name portal --network host --env-file "$RUNNER_TEMP/portal.env" \
            --volume "$PWD/test_data/admin-keys/es256.pem:/run/secrets/admin-key.pem:ro" \
            status-list-portal
          for _ in $(seq 30); do
            curl --fail --silent --output /dev/null http://localhost:8080/health/ready && break
            sleep 1
          done
          curl --fail --silent --show-error http://localhost:8080/health/ready
          curl --fail --silent --show-error --header 'Accept: text/html' http://localhost:8080/ \
            | grep -q '<meta http-equiv="content-security-policy"'

      - name: Show the server's log
        if: failure()
        run: docker logs portal

      # Cross-compiled from the runner's platform: the runner cannot emulate arm64, so a step
      # that ran on arm64 would fail here.
      - name: Build the image for arm64
        run: |
          docker build --platform linux/arm64 --tag status-list-portal:arm64 .
          test "$(docker image inspect --format '{{.Architecture}}' status-list-portal:arm64)" = arm64

  markdown:
    name: Markdown
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          globs: "**/*.md"

  toml:
    name: TOML
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install tombi
        uses: tombi-toml/setup-tombi@e0db57b0c2dfee98ec48ee3f02beb983fba2aa09 # v1.9.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint TOML
        run: tombi lint

      - name: Check TOML formatting
        run: tombi format --check

  yaml:
    name: YAML
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false

      - name: Install yamlfmt
        run: go install github.com/google/yamlfmt/cmd/yamlfmt@v0.21.0

      - name: Check YAML formatting
        run: yamlfmt -lint .

  typos:
    name: Typos
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check spelling
        uses: crate-ci/typos@7f9d0819ca1c008ade73f4b41fa9d258d48f605b # v1.51.1
