[package]
name = "status-list-portal"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
publish = false
repository = "https://github.com/ADORSYS-GIS/status-list-portal"
description = "Developer portal for the Status List Server: GitHub sign-in and sandbox issuer registration"
default-run = "server"

[lints.rust]
future_incompatible = { level = "warn", priority = -1 }
nonstandard_style = { level = "warn", priority = -1 }
rust_2018_idioms = { level = "warn", priority = -1 }
unused = { level = "warn", priority = -1 }
unsafe_code = "forbid"
unused_lifetimes = "warn"

[lints.clippy]
dbg_macro = "warn"
doc_markdown = "warn"
todo = "warn"

[[test]]
name = "integration"
path = "src/tests/mod.rs"

[dependencies]
anyhow = "1.0"
axum = { version = "0.8", features = ["macros"] }
config = { version = "0.15", default-features = false }
derive_more = { version = "2.1", features = ["deref", "display"] }
dotenvy = "0.15"
http = "1.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.54", features = ["macros", "net", "rt-multi-thread", "signal"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["catch-panic", "timeout", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
utoipa = "6.0"
utoipa-axum = "0.3"

[dev-dependencies]
insta = { version = "1.49", features = ["json"] }
tower = { version = "0.5", features = ["util"] }

[profile.dev]
opt-level = 1
debug = true
incremental = true

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
