# Services for local development and tests: `docker compose up -d`.
services:
  db:
    image: postgres:18.6
    restart: unless-stopped
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: portal
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Grafana, with an OpenTelemetry Collector, Tempo, Loki and Prometheus behind it:
  # `docker compose --profile observability up -d`. docs/telemetry.md shows how to use it.
  otel-lgtm:
    image: grafana/otel-lgtm:0.37.0
    profiles: [observability]
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
      - "127.0.0.1:4318:4318"

volumes:
  pgdata:
